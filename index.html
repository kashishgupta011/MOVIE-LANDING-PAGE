<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">MOVIE</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
            <a href="#">Popular</a>
        </nav>

        <!-- SEARCH -->
        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="Search movie..."
            >

            <button
                type="button"
                class="search-btn"
                id="search-btn"
            >
                Search
            </button>
        </div>

    </header>


    <!-- HERO SECTION -->
    <main class="hero">

        <div class="hero-content">

            <p class="small-title">ANIMATED MOVIE</p>

            <h1 id="hero-title">
                THE LITTLE MERMAID
            </h1>

            <p class="description" id="hero-description">
                Dive into an amazing underwater adventure
                filled with friendship, courage and magic.
            </p>

            <div class="buttons">

                <a
                    id="watch-btn"
                    class="watch-btn"
                    href="#"
                    target="_blank"
                >
                    WATCH NOW
                </a>

                <button
                    id="more-btn"
                    class="more-btn"
                    type="button"
                >
                    MORE INFO
                </button>

            </div>

        </div>

    </main>


    <!-- MOVIES SECTION -->
    <section class="movies">

        <h2>Featured Movies</h2>


        <!-- SLIDER ARROWS -->
        <div class="slider-buttons">

            <button
                id="prev"
                type="button"
            >
                ‹
            </button>

            <button
                id="next"
                type="button"
            >
                ›
            </button>

        </div>


        <!-- MOVIE CARDS -->
        <div class="movie-list">

            <div class="movie-card">
                <img
                    src="images/the-little-mermaid.jpeg"
                    alt="The Little Mermaid"
                >
                <h3>The Little Mermaid</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/the-black-demon.jpg"
                    alt="The Black Demon"
                >
                <h3>The Black Demon</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/bg-the-covenant.jpeg"
                    alt="The Covenant"
                >
                <h3>The Covenant</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/the-tank.jpeg"
                    alt="The Tank"
                >
                <h3>The Tank</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/65.jpg"
                    alt="65"
                >
                <h3>65</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/bg-little-mermaid.jpg"
                    alt="The Little Mermaid"
                >
                <h3>The Little Mermaid</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/bg-the-black-demon.jpeg"
                    alt="The Black Demon"
                >
                <h3>The Black Demon</h3>
            </div>


            <div class="movie-card">
                <img
                    src="images/bg-the-covenant.jpeg"
                    alt="The Covenant"
                >
                <h3>The Covenant</h3>
            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
